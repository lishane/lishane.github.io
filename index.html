<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="description" content="Tap the die to roll. Roll a five? Drink!">
    <title>Roll Five</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/game.css">
    <script src="assets/game.js" defer></script>
  </head>
  <body>
    <main aria-label="Roll Five">
      <button id="dice-display" class="die" type="button" aria-label="Roll the die. Currently showing 5.">
        <span class="die-face" aria-hidden="true"></span>
      </button>
      <p id="message">Tap to roll</p>
      <span id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
    </main>
  </body>
</html>
