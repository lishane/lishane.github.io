<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="description" content="Tap the die to roll. Roll a five? Drink!">
    <title>Roll Five</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="assets/game.css?v=20261018-solid-3d">
    <script src="assets/game.js?v=20261018-solid-3d" defer></script>
    <script src="assets/die-3d.js?v=20261018-solid-3d" defer></script>
  </head>
  <body>
    <header class="brand" aria-label="Roll Five">
      <img src="assets/logo.png" alt="" width="38" height="38">
      <span>Roll Five</span>
    </header>
    <main aria-label="Roll Five">
      <div id="dice-stage" class="dice-stage">
        <button id="dice-display" class="die" type="button" aria-label="Roll the die. Currently showing 6.">
          <svg id="die-art" class="die-art" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
            <path class="die-outline" d="M52 22 C90 17 153 19 187 24 C205 27 215 38 217 57 C221 97 221 158 215 187 C212 207 201 216 181 218 C142 222 86 220 53 215 C33 212 23 202 21 183 C17 145 18 88 23 55 C25 36 34 25 52 22 Z"/>
            <g id="front-pips"></g>
          </svg>
        </button>
      </div>
      <div id="result" class="result">
        <p id="roll-result"></p>
        <p id="message">Tap to roll</p>
        <p id="instruction"></p>
      </div>
      <span id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
    </main>
  </body>
</html>
