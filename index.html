<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="description" content="Tap the die to roll. Roll a five? Drink!">
    <title>Roll Five</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="assets/game.css?v=20261016-artwork">
    <script src="assets/game.js?v=20261016-artwork" defer></script>
  </head>
  <body>
    <header class="brand" aria-label="Roll Five">
      <img src="assets/logo.png" alt="" width="38" height="38">
      <span>Roll Five</span>
    </header>
    <main aria-label="Roll Five">
      <div id="dice-stage" class="dice-stage">
        <button id="dice-display" class="die" type="button" aria-label="Roll the die. Currently showing 6.">
          <svg id="die-art" class="die-art" viewBox="0 0 1254 1254" aria-hidden="true" focusable="false">
            <image href="assets/die-body.png" width="1254" height="1254"/>
            <g id="top-pips"></g>
            <g id="side-pips"></g>
            <g id="front-pips"></g>
          </svg>
        </button>
      </div>
      <div id="result" class="result">
        <p id="message">Tap to roll</p>
        <p id="instruction"></p>
      </div>
      <span id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
    </main>
  </body>
</html>
